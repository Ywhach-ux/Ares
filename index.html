<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ARES — Personal AI Life Assistant</title>
<style>
/* ============================= THEME ============================= */
:root{
  --bg:#05080e; --bg2:#080d16; --panel:#0c1420; --panel2:#101a29; --panel3:#152135;
  --line:#1a2941; --line2:#25384f;
  --tx:#e9effb; --mut:#7d92ad; --dim:#4f6480;
  --cy:#22d3ee; --vi:#8b5cf6; --gr:#34d399; --am:#fbbf24; --rd:#fb7185; --bl:#60a5fa;
  --r:14px; --r2:10px;
  --glow:0 0 0 1px rgba(34,211,238,.14), 0 8px 32px -12px rgba(34,211,238,.25);
  --sh:0 1px 0 rgba(255,255,255,.03), 0 12px 32px -18px #000;
}
[data-theme="light"]{
  --bg:#eef2f8; --bg2:#e6ecf5; --panel:#ffffff; --panel2:#f6f8fc; --panel3:#eef2f9;
  --line:#dde5f0; --line2:#c8d4e4;
  --tx:#0c1524; --mut:#5b6d86; --dim:#93a3b8;
  --sh:0 1px 2px rgba(16,32,60,.06), 0 10px 28px -20px rgba(16,32,60,.35);
  --glow:0 0 0 1px rgba(34,150,180,.18), 0 8px 28px -16px rgba(20,120,160,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 82% -8%, rgba(34,211,238,.09), transparent 60%),
    radial-gradient(900px 500px at 8% 105%, rgba(139,92,246,.09), transparent 60%),
    var(--bg);
  color:var(--tx);
  font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ============================= SHELL ============================= */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{
  background:linear-gradient(180deg,var(--panel),var(--bg2));
  border-right:1px solid var(--line);
  padding:18px 14px; display:flex; flex-direction:column; gap:6px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand .orb{
  width:34px;height:34px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 32% 30%,#7df9ff,#22d3ee 42%,#5b21b6 100%);
  box-shadow:0 0 18px rgba(34,211,238,.55), inset 0 0 12px rgba(255,255,255,.4);
  animation:pulse 3.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.94}50%{transform:scale(1.07);opacity:1}}
.brand b{display:block;font-size:15px;letter-spacing:.14em;font-weight:700}
.brand span{font-size:10.5px;color:var(--mut);letter-spacing:.16em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-i{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r2);
  color:var(--mut);font-size:13.5px;font-weight:500;transition:.16s;text-align:left;width:100%;
  border:1px solid transparent;
}
.nav-i i{font-style:normal;width:18px;text-align:center;font-size:14px;opacity:.85}
.nav-i:hover{background:var(--panel2);color:var(--tx)}
.nav-i.on{background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(34,211,238,.02));color:var(--tx);border-color:rgba(34,211,238,.28)}
.nav-i.on i{color:var(--cy);opacity:1;text-shadow:0 0 10px var(--cy)}
.side-foot{font-size:10.5px;color:var(--dim);padding:12px 8px 2px;border-top:1px solid var(--line);letter-spacing:.06em}

main{padding:26px 30px 90px;max-width:1320px;width:100%}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:25px;font-weight:700;letter-spacing:-.015em}
.topbar p{color:var(--mut);font-size:13px;margin-top:3px}
.clock{text-align:right}
.clock b{font-size:24px;font-weight:600;letter-spacing:.02em}
.clock span{display:block;font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}

/* ============================= PRIMITIVES ============================= */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--sh)}
.card+.card{margin-top:14px}
.card h3{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:1.55fr 1fr}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g-2-1{grid-template-columns:1fr}}
@media(max-width:860px){.g2,.g3{grid-template-columns:1fr}}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--tx);
  font-size:12.5px;font-weight:500;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--cy);color:var(--cy);background:var(--panel3)}
.btn.pri{background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(139,92,246,.22));border-color:rgba(34,211,238,.45);color:var(--tx)}
.btn.pri:hover{box-shadow:0 0 20px -4px rgba(34,211,238,.5)}
.btn.sm{padding:5px 9px;font-size:11.5px;border-radius:7px}
.btn.dgr:hover{border-color:var(--rd);color:var(--rd)}
.btn.gh{border-color:transparent;background:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--panel2);color:var(--tx)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

.inp,select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;font-size:13px;outline:none;transition:.15s;
}
.inp:focus,select:focus,textarea:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.1)}
label.f{display:block;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:5px;font-weight:600}
.field{margin-bottom:12px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.chip.cy{border-color:rgba(34,211,238,.4);color:var(--cy);background:rgba(34,211,238,.08)}
.chip.gr{border-color:rgba(52,211,153,.4);color:var(--gr);background:rgba(52,211,153,.08)}
.chip.am{border-color:rgba(251,191,36,.4);color:var(--am);background:rgba(251,191,36,.08)}
.chip.rd{border-color:rgba(251,113,133,.4);color:var(--rd);background:rgba(251,113,133,.08)}
.chip.vi{border-color:rgba(139,92,246,.45);color:#b79cff;background:rgba(139,92,246,.1)}

.p0{color:var(--rd)} .p1{color:var(--am)} .p2{color:var(--bl)} .p3{color:var(--dim)}
.bar{height:6px;border-radius:99px;background:var(--panel3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cy),var(--vi));transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar.gr>i{background:linear-gradient(90deg,var(--gr),var(--cy))}
.bar.am>i{background:linear-gradient(90deg,var(--am),var(--rd))}

.ring{position:relative;display:inline-grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;text-align:center;line-height:1.1}
.ring .v b{font-size:17px;font-weight:700;display:block}
.ring .v small{font-size:9px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}

.empty{color:var(--dim);font-size:12.5px;padding:16px 0;text-align:center;font-style:italic}
.hr{height:1px;background:var(--line);margin:13px 0}

/* ============================= TIMELINE ============================= */
.tl{position:relative;padding-left:74px}
.tl::before{content:"";position:absolute;left:58px;top:6px;bottom:6px;width:1px;background:linear-gradient(180deg,transparent,var(--line2) 8%,var(--line2) 92%,transparent)}
.tl-b{position:relative;margin-bottom:8px;border:1px solid var(--line);background:var(--panel2);border-radius:var(--r2);padding:10px 12px;transition:.16s;display:flex;gap:11px;align-items:flex-start}
.tl-b:hover{border-color:var(--line2);background:var(--panel3)}
.tl-b .t{position:absolute;left:-74px;top:11px;width:52px;text-align:right;font-size:11.5px;color:var(--mut);font-weight:600}
.tl-b .t small{display:block;font-size:9.5px;color:var(--dim);font-weight:500}
.tl-b.now{border-color:rgba(34,211,238,.5);box-shadow:0 0 0 1px rgba(34,211,238,.14),0 0 26px -12px var(--cy);background:linear-gradient(90deg,rgba(34,211,238,.09),transparent 70%)}
.tl-b.now .t{color:var(--cy)}
.tl-b.done{opacity:.5}
.tl-b.done .ttl{text-decoration:line-through}
.tl-b.miss{border-color:rgba(251,113,133,.32);background:rgba(251,113,133,.05)}
.tl-b .ttl{font-size:13.5px;font-weight:600}
.tl-b .sub{font-size:11.5px;color:var(--mut);margin-top:2px}
.tl-b .acts{display:flex;gap:4px;opacity:0;transition:.15s}
.tl-b:hover .acts{opacity:1}
@media(hover:none){.tl-b .acts{opacity:1}}
.dot{width:7px;height:7px;border-radius:50%;background:var(--cy);flex:none;margin-top:6px;box-shadow:0 0 8px currentColor}

/* ============================= CHAT ============================= */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:420px}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 4px 12px}
.msg{max-width:82%;padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(139,92,246,.16));border:1px solid rgba(34,211,238,.3);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a b{color:var(--cy)}
.msg.a .lbl{display:block;font-size:9.5px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-bottom:6px;font-weight:700}
.quick{display:flex;gap:7px;flex-wrap:wrap;padding:10px 0 8px;border-top:1px solid var(--line)}
.quick .btn{font-size:11.5px}
.composer{display:flex;gap:9px;align-items:center;padding-top:10px}

/* ============================= MISC ============================= */
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 13px}
.stat .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.stat .v{font-size:20px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.stat .s{font-size:11px;color:var(--mut);margin-top:2px}
.list{display:flex;flex-direction:column;gap:1px}
.li{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13px}
.li:last-child{border-bottom:0}
.li .nm{flex:1;min-width:0}
.li .nm small{display:block;color:var(--dim);font-size:11px}
.ck{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;transition:.15s;font-size:11px;color:transparent}
.ck:hover{border-color:var(--cy)}
.ck.on{background:var(--gr);border-color:var(--gr);color:#04140d}
.tag{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--panel3);color:var(--mut);font-weight:600;letter-spacing:.04em}
.pill{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px}
.pill button{padding:5px 11px;border-radius:6px;font-size:11.5px;color:var(--mut);font-weight:600;transition:.15s}
.pill button.on{background:var(--panel3);color:var(--cy);box-shadow:0 0 0 1px rgba(34,211,238,.25)}
.spark{width:100%;height:52px;display:block;overflow:visible}
.mini{font-size:11px;color:var(--dim)}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);z-index:99;
  background:var(--panel3);border:1px solid var(--line2);border-left:3px solid var(--cy);border-radius:11px;
  padding:11px 17px;font-size:13px;box-shadow:0 18px 48px -14px #000;transition:.35s cubic-bezier(.2,.9,.3,1);max-width:88vw}
#toast.on{transform:translateX(-50%) translateY(0)}

/* onboarding */
.ob{min-height:100vh;display:grid;place-items:center;padding:26px}
.ob-c{width:100%;max-width:660px}
.ob-c .card{padding:26px}
.steps{display:flex;gap:6px;margin-bottom:20px}
.steps i{flex:1;height:3px;border-radius:9px;background:var(--line2);transition:.3s}
.steps i.on{background:linear-gradient(90deg,var(--cy),var(--vi));box-shadow:0 0 12px -2px var(--cy)}

/* focus overlay */
.focus{position:fixed;inset:0;z-index:80;background:radial-gradient(900px 500px at 50% 0%,rgba(34,211,238,.1),transparent 65%),var(--bg);
  display:grid;place-items:center;padding:24px;animation:in .3s}
.focus .inner{text-align:center;max-width:520px;width:100%}

@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:8px;
    padding:10px 12px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);z-index:40}
  .brand{padding:0 10px 0 2px;flex:none} .brand .orb{width:26px;height:26px} .brand div{display:none}
  .nav{flex-direction:row;gap:4px;flex:none}
  .nav-i{padding:7px 11px;font-size:12.5px;white-space:nowrap}
  .nav-i span{display:none}
  .nav-i.on span{display:inline}
  .side-foot{display:none}
  main{padding:18px 15px 80px}
  .topbar h1{font-size:20px}
  .chat-wrap{height:calc(100vh - 240px)}
  .msg{max-width:92%}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ==========================================================================
   0. UTILITIES
   ========================================================================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid= ()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mins=t=>{const[h,m]=String(t||'00:00').split(':').map(Number);return (h||0)*60+(m||0)};
const hm=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const dstr=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dstr(d)};
const dayName=s=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(s+'T12:00:00').getDay()];
const daysUntil=s=>Math.round((new Date(s+'T12:00:00')-new Date(dstr()+'T12:00:00'))/864e5);
const durFmt=m=>m>=60?`${Math.floor(m/60)}h ${m%60?m%60+'m':''}`.trim():`${m}m`;
const sum=a=>a.reduce((x,y)=>x+y,0);
const avg=a=>a.length?sum(a)/a.length:0;
const pct=(a,b)=>b?Math.round(a/b*100):0;
const rnd=(a,b)=>a+Math.random()*(b-a);

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600);
}

/* ==========================================================================
   1. STATE STORE
   ========================================================================== */
const KEY='ares.v1';
let S = null;

function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)) }catch(e){} }
function load(){
  try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null }catch(e){ return null }
}

function blankState(){
  return {
    onboarded:false, version:1,
    profile:{name:'', aiName:'ARES', personality:'Direct', age:'', role:'', tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC',
      wake:'07:00', sleep:'23:00', commitments:[], energy:3, mood:'Neutral'},
    goals:[], tasks:[], plans:{}, events:[],
    study:{subjects:[],exams:[],sessions:[]},
    fitness:{goal:'General fitness', sessions:[], restDays:[0]},
    habits:[], money:{income:0, budget:0, txns:[]},
    interests:[], skills:[], sleep:[], memory:[], chat:[],
    context:{hoursAvailable:null, note:''},
    settings:{theme:'dark', mode:'standard', notif:true, quiet:'22:30-07:00', maxNotif:6, screenTime:{productive:0,entertainment:0}},
    xp:0, created:dstr()
  };
}

function demoState(){
  const t=dstr();
  const st=blankState();
  st.onboarded=true;
  st.profile={
    name:'Kai', aiName:'ARES', personality:'Direct', age:17, role:'Student — Grade 12',
    tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Kolkata',
    wake:'06:45', sleep:'23:00', energy:3, mood:'Focused',
    commitments:[{id:uid(),title:'School',days:[1,2,3,4,5],start:'08:30',end:'15:30'}]
  };
  st.goals=[
    {id:uid(),title:'Score 95%+ in Grade 12 Boards',cat:'Education',deadline:addDays(t,96),importance:5,progress:38,target:'95% aggregate',why:'Opens the door to the university I want.',effort:'3h/day',parent:null},
    {id:uid(),title:'Crack the Medical Entrance Exam',cat:'Career',deadline:addDays(t,240),importance:5,progress:22,target:'Top 5% rank',why:'Long-term career path.',effort:'4h/day',parent:null},
    {id:uid(),title:'Reach 70kg bench / 100kg squat',cat:'Health',deadline:addDays(t,150),importance:3,progress:45,target:'Strength standards',why:'Health + confidence.',effort:'4x/week',parent:null},
    {id:uid(),title:'Build 6 months of emergency savings',cat:'Finance',deadline:addDays(t,180),importance:3,progress:30,target:'₹18,000',why:'Financial independence basics.',effort:'Save 30%/mo',parent:null},
    {id:uid(),title:'Reach 1400 chess rating',cat:'Hobby',deadline:addDays(t,200),importance:2,progress:52,target:'1400 Elo',why:'Sharpens strategic thinking.',effort:'30m/day',parent:null},
    {id:uid(),title:'Ship a personal project',cat:'Skills',deadline:addDays(t,120),importance:4,progress:15,target:'1 deployed app',why:'Proof of skill.',effort:'3h/week',parent:null}
  ];
  st.study.subjects=[
    {id:uid(),name:'Physics',topics:[
      {id:uid(),name:'Laws of Motion',status:'Strong',accuracy:88,revisions:3,last:addDays(t,-4)},
      {id:uid(),name:'Rotational Motion',status:'Weak',accuracy:54,revisions:1,last:addDays(t,-9)},
      {id:uid(),name:'Thermodynamics',status:'Pending',accuracy:0,revisions:0,last:null},
      {id:uid(),name:'Electrostatics',status:'Weak',accuracy:61,revisions:2,last:addDays(t,-6)}]},
    {id:uid(),name:'Chemistry',topics:[
      {id:uid(),name:'Redox Reactions',status:'Weak',accuracy:61,revisions:2,last:addDays(t,-5)},
      {id:uid(),name:'Chemical Bonding',status:'Strong',accuracy:79,revisions:2,last:addDays(t,-7)},
      {id:uid(),name:'Equilibrium',status:'Weak',accuracy:66,revisions:1,last:addDays(t,-11)},
      {id:uid(),name:'Organic Basics',status:'Pending',accuracy:0,revisions:0,last:null}]},
    {id:uid(),name:'Biology',topics:[
      {id:uid(),name:'Cell Structure',status:'Strong',accuracy:82,revisions:3,last:addDays(t,-3)},
      {id:uid(),name:'Genetics',status:'Weak',accuracy:58,revisions:1,last:addDays(t,-10)},
      {id:uid(),name:'Human Physiology',status:'Pending',accuracy:0,revisions:0,last:null},
      {id:uid(),name:'Ecology',status:'Strong',accuracy:74,revisions:2,last:addDays(t,-8)}]}
  ];
  st.study.exams=[
    {id:uid(),subject:'Physics',title:'Physics Unit Test',date:addDays(t,2)},
    {id:uid(),subject:'Chemistry',title:'Chemistry Chapter Test',date:addDays(t,5)}
  ];

const PRI_W = {P0:4,P1:3,P2:2,P3:1};
const priOf = w => w>=4?'P0':w>=3?'P1':w>=2?'P2':'P3';

/** Free time windows for a date, subtracting fixed commitments & calendar events. */
function freeWindows(date, fromM){
  const p=S.profile, dow=new Date(date+'T12:00:00').getDay();
  let start = fromM ?? mins(p.wake);
  const sleepM = mins(p.sleep);
  const end = sleepM>start ? sleepM : sleepM+1440;
  const busy=[];
  (p.commitments||[]).forEach(c=>{ if((c.days||[]).includes(dow)) busy.push([mins(c.start),mins(c.end),c.title]) });
  S.events.filter(e=>e.date===date).forEach(e=>busy.push([mins(e.start),mins(e.end),e.title]));
  S.study.exams.filter(e=>e.date===date).forEach(e=>busy.push([mins(e.start),mins(e.start)+120,e.title]));
  busy.sort((a,b)=>a[0]-b[0]);
  const wins=[]; let cur=start;
  busy.forEach(b=>{ if(b[0]>cur) wins.push([cur,b[0]]); cur=Math.max(cur,b[1]) });
  if(end>cur) wins.push([cur,end]);
  return wins.filter(w=>w[1]-w[0]>=20);
}

/** Weakest topics across all subjects, ranked. */
function weakTopics(){
  const out=[];
  S.study.subjects.forEach(s=>s.topics.forEach(t=>{
    if(t.status==='Pending') out.push({sub:s.name,topic:t.name,acc:t.accuracy||0,status:'Pending',w:70});
    else if(t.status==='Weak') out.push({sub:s.name,topic:t.name,acc:t.accuracy,status:'Weak',w:100-t.accuracy+40});
  }));
  return out.sort((a,b)=>b.w-a.w);
}
function nearestExam(subject){
  const list=S.study.exams.filter(e=>e.date>=dstr()&&(!subject||e.subject===subject)).sort((a,b)=>a.date.localeCompare(b.date));
  return list[0]||null;
}

/** Build the candidate pool of tasks for a given date. */
function candidates(date){
  const c=[]; const today=date===dstr();
  const avail=S.context.hoursAvailable;

  /* --- Study --- */
  const weak=weakTopics();
  weak.slice(0,6).forEach((w,i)=>{
    const ex=nearestExam(w.sub);
    const dLeft=ex?daysUntil(ex.date):99;
    let wgt = w.status==='Pending'?3:3;
    if(dLeft<=2) wgt=4; else if(dLeft<=7) wgt=3;
    c.push({
      cat:'Study', subject:w.sub,
      title:`${w.sub} — ${w.topic}`,
      sub: w.status==='Pending' ? 'First-pass concept + notes' : `Targeted practice (accuracy ${w.acc}%)`,
      dur: w.status==='Pending'?55:45,
      pri: wgt,
      urgency: dLeft<=2?90:dLeft<=7?60:30,
      weak: w.w,
      reason: ex ? `${ex.title} in ${dLeft} day${dLeft===1?'':'s'} · weakest area` : `Weak area — accuracy ${w.acc}%`,
      prefs:['evening','afternoon']
    });
  });
  /* Revision / spaced repetition for strong-but-aging topics */
  S.study.subjects.forEach(s=>s.topics.forEach(t=>{
    if(t.status==='Strong'&&t.last&&daysUntil(addDays(t.last,7))<=0){
      c.push({cat:'Study',subject:s.name,title:`${s.name} — ${t.name} revision`,
        sub:'Spaced repetition · 15 MCQs',dur:30,pri:2,urgency:35,weak:20,
        reason:`Last revised ${Math.abs(daysUntil(t.last))} days ago`,prefs:['evening']});
    }
  }));

  /* --- Fitness --- */
  const dow=new Date(date+'T12:00:00').getDay();
  const isRest=(S.fitness.restDays||[]).includes(dow);
  const didToday=S.fitness.sessions.some(x=>x.date===date&&x.done);
  if(!isRest&&!didToday){
    const types=['Strength','Cardio','Mobility','Strength','Cardio','Mobility','Strength'];
    c.push({cat:'Fitness',title:`Workout — ${types[dow]}`,
      sub:'Warm-up → main set → cool-down',dur:types[dow]==='Mobility'?25:45,
      pri:2,urgency:40,weak:15,reason:'Keeps your weekly consistency above 80%',prefs:['evening','morning']});
  }

  /* --- Habits --- */
  S.habits.forEach(h=>{
    if(h.log&&h.log[date]) return;
    if(/wake|morning/i.test(h.name))
      c.push({cat:'Habit',title:h.name,sub:'Morning routine',dur:20,pri:3,urgency:70,weak:10,reason:'Anchor habit for the day',prefs:['morning']});
    if(/read/i.test(h.name))
      c.push({cat:'Habit',title:h.name,sub:'Reading block',dur:20,pri:2,urgency:20,weak:10,reason:'Builds long-term vocabulary & focus',prefs:['evening']});
    if(/revision/i.test(h.name))
      c.push({cat:'Habit',title:h.name,sub:'Active recall before sleep',dur:20,pri:2,urgency:30,weak:10,reason:'Improves retention overnight',prefs:['night']});
  });

  /* --- Hobbies / Interests --- */
  S.interests.forEach(it=>{
    const done=sum(Object.values(it.log||{}).filter((_,i)=>i>=0)) ;
    c.push({cat:'Interest',title:`${it.name} practice`,sub:`Current ${it.value} / target ${it.target} ${it.unit}`,
      dur:40,pri:1,urgency:15,weak:5,reason:`${it.name} goal is behind weekly pace`,prefs:['evening']});
  });

  /* --- Goals needing movement --- */
  S.goals.filter(g=>g.importance>=4).slice(0,2).forEach(g=>{
    const d=daysUntil(g.deadline);
    c.push({cat:'Goal',title:`${g.title} — next step`,sub:`Progress ${g.progress}% · ${d} days left`,
      dur:45,pri:d<20?3:2,urgency:d<20?70:40,weak:20,reason:`Nearest major deadline: ${d} days`,prefs:['afternoon','evening']});
  });

  /* --- Backlog recovery --- */
  const backlog=weakTopics().filter(w=>w.status==='Pending');
  if(backlog.length>3){
    c.push({cat:'Study',subject:backlog[0].sub,title:`Backlog recovery — ${backlog[0].sub}`,
      sub:`Clearing ${backlog.length} pending topics gradually`,dur:50,pri:2,urgency:45,weak:60,
      reason:'Backlog distribution plan active',prefs:['afternoon']});
  }

  /* --- Wind down --- */
  c.push({cat:'Routine',title:'Plan tomorrow & wind down',sub:'Review, set 3 priorities, screens off',dur:20,pri:3,urgency:60,weak:5,reason:'Protects sleep quality',prefs:['night']});

  /* Time-limited mode: keep only the highest-weight items that fit */
  c.sort((a,b)=>score(b)-score(a));
  if(avail){
    let budget=avail, kept=[];
    for(const x of c){ if(budget>=x.dur){ kept.push(x); budget-=x.dur } }
    return kept.length?kept:c.slice(0,3);
  }
  return c;
}
const score = c => PRI_W[priOf(c.pri)]*100 + (c.urgency||0) + (c.weak||0);

const PREF_MAP={morning:[5*60,11*60],afternoon:[11*60,17*60],evening:[17*60,21*60],night:[21*60,24*60]};
function prefFit(c,startM){
  if(!c.prefs) return 0;
  let best=-1;
  c.prefs.forEach(p=>{const[a,b]=PREF_MAP[p];if(startM>=a&&startM<b)best=1});
  return best;
}

/** Generate a full day plan. */
function buildPlan(date, opts={}){
  const from = opts.from ?? mins(S.profile.wake);
  const wins = freeWindows(date, from);
  const pool = candidates(date);
  const blocks=[]; const used=new Set();
  const now = date===dstr()? nowM() : -1;

  wins.forEach(([ws,we])=>{
    let cur = ws;
    while(we-cur >= 25){
      let best=null,bestScore=-1e9;
      pool.forEach((c,i)=>{
        if(used.has(i)) return;
        if(c.dur > we-cur) return;
        let sc = score(c) + prefFit(c,cur)*60;
        /* Avoid stacking two heavy study blocks back-to-back */
        const last=blocks[blocks.length-1];
        if(last && last.cat==='Study' && c.cat==='Study') sc -= 70;
        if(last && last.subject && last.subject===c.subject) sc -= 45;
        if(sc>bestScore){bestScore=sc;best=i}
      });
      if(best===null) break;
      const c=pool[best]; used.add(best);
      blocks.push({id:uid(),date,start:cur,dur:c.dur,title:c.title,sub:c.sub,cat:c.cat,
        subject:c.subject||null,pri:priOf(c.pri),reason:c.reason,done:false,fromPlan:true});
      cur += c.dur + 10; /* 10-minute transition buffer */
      if(cur<now) { /* past blocks in a fresh plan are marked missed */
        blocks[blocks.length-1].missed = true;
      }
    }
  });
  return blocks;
}

/** Ensure a plan exists for a date; generate if missing. */
function ensurePlan(date){
  if(!S.plans[date]) S.plans[date]=buildPlan(date);
  return S.plans[date];
}

/** THE CORE: dynamic rescheduling of the remaining day. */
function replan(reason, opts={}){
  const date=dstr();
  const plan=S.plans[date]||[];
  const done=plan.filter(b=>b.done);
  const now=nowM();
  const from=opts.from ?? Math.max(now, mins(S.profile.wake));
  const fresh=buildPlan(date,{from});
  /* never resurrect completed blocks */
  const doneKeys=new Set(done.map(b=>b.title));
  const merged=[...done, ...fresh.filter(b=>!doneKeys.has(b.title))];
  merged.sort((a,b)=>a.start-b.start);
  S.plans[date]=merged;

  /* --- what got dropped? --- */
  const before=new Set(plan.filter(b=>!b.done).map(b=>b.title));
  const after=new Set(fresh.map(b=>b.title));
  const dropped=[...before].filter(t=>!after.has(t));
  const deferred=dropped.map(t=>{
    const b=plan.find(x=>x.title===t);
    return {title:t,pri:b?b.pri:'P2',dur:b?b.dur:30};
  });
  /* push deferred items into tomorrow */
  if(deferred.length){
    const tm=addDays(date,1);
    if(!S.plans[tm]) S.plans[tm]=buildPlan(tm);
    deferred.forEach((d,i)=>{
      S.plans[tm].push({id:uid(),date:tm,start:mins(S.profile.wake)+60+i*50,dur:d.dur,
        title:d.title+' (carried over)',sub:'Deferred from a disrupted day',cat:'Carried',
        pri:d.pri,reason:'Rescheduled instead of dropped',done:false,carried:true});
    });
    S.plans[tm].sort((a,b)=>a.start-b.start);
  }
  save();
  return {added:fresh.length, deferred, reason};
}

/** Decision engine — the single most useful next action. */
function nextBestAction(){
  const date=dstr(), now=nowM();
  const plan=ensurePlan(date);
  const current=plan.find(b=>!b.done&&now>=b.start&&now<b.start+b.dur);
  if(current) return {block:current, live:true,
    text:current.title,
    why:`You're inside this block now (${b=>0,hm(current.start)}–${hm(current.start+current.dur)}). ${current.reason}.`,
    minsLeft:current.start+current.dur-now};

  const upcoming=plan.filter(b=>!b.done&&b.start>=now).sort((a,b)=>a.start-b.start);
  if(upcoming.length){
    const b=upcoming[0];
    return {block:b, live:false, text:b.title,
      why:`${b.reason}. Starts at ${hm(b.start)} — ${durFmt(b.start-now)} from now.`,
      minsLeft:b.dur};
  }
  const missed=plan.filter(b=>!b.done&&b.start<now);
  if(missed.length){
    const b=missed[0];
    return {block:b,live:false,text:b.title,why:`This block was missed earlier today. ${b.reason}.`,minsLeft:b.dur,missed:true};
  }
  return {text:'Nothing scheduled — rest or pull something forward',
    why:'All planned blocks are complete. Recovery is part of the plan.',minsLeft:0};
}

/** Pattern detection (Batman mode / analytics). */
function detectPatterns(){
  const out=[];
  const all=Object.values(S.plans).flat();
  const done=all.filter(b=>b.done), missed=all.filter(b=>b.missed&&!b.done);
  if(done.length>=5){
    const buckets={'Morning (6–12)':0,'Afternoon (12–17)':0,'Evening (17–21)':0,'Night (21+)':0};
    done.forEach(b=>{
      const h=Math.floor(b.start/60);
      if(h<12)buckets['Morning (6–12)']++;
      else if(h<17)buckets['Afternoon (12–17)']++;
      else if(h<21)buckets['Evening (17–21)']++;
      else buckets['Night (21+)']++;
    });
    const top=Object.entries(buckets).sort((a,b)=>b[1]-a[1])[0];
    out.push({type:'Observation',text:`You completed ${top[1]} of your last ${done.length} sessions in the ${top[0].split(' ')[0].toLowerCase()} window.`});
    out.push({type:'Inference',text:`You may focus better during this period. Worth testing with your hardest subject.`});
  }
  const sleepShort=S.sleep.filter(s=>s.dur<420).length;
  if(S.sleep.length>=4&&sleepShort>=2){
    out.push({type:'Observation',text:`${sleepShort} of your last ${S.sleep.length} nights were under 7 hours.`});
    out.push({type:'Inference',text:`Study completion tends to drop after short sleep. Consider moving difficult work later on those days.`});
  }
  if(missed.length>=3){
    const ev=missed.filter(b=>b.start>=17*60).length;
    if(ev>=2) out.push({type:'Observation',text:`${ev} of ${missed.length} missed blocks were scheduled after 5 PM.`});
  }
  const spend=sum(S.money.txns.filter(t=>t.type==='out'&&t.date>=addDays(dstr(),-30)).map(t=>t.amount));
  if(spend>0){
    const byCat={};
    S.money.txns.filter(t=>t.type==='out'&&t.date>=addDays(dstr(),-30)).forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
    const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
    if(top) out.push({type:'Observation',text:`Your largest spending category this month is ${top[0]} at ₹${top[1]}.`});
  }
  return out;
}

/** Consistency / progress metrics used across the UI. */
function metrics(){
  const date=dstr();
  const plan=S.plans[date]||[];
  const doneB=plan.filter(b=>b.done);
  const studyPlan=plan.filter(b=>b.cat==='Study');
  const studyDone=studyPlan.filter(b=>b.done);
  const fitToday=S.fitness.sessions.some(s=>s.date===date&&s.done);
  const habitsToday=S.habits.filter(h=>h.log&&h.log[date]).length;
  const dayProgress=plan.length?pct(doneB.length,plan.length):0;
  const week=[...Array(7)].map((_,i)=>addDays(date,-(6-i)));
  const weekStudy=week.map(d=>(S.plans[d]||[]).filter(b=>b.cat==='Study'&&b.done).reduce((a,b)=>a+b.dur,0)/60);
  const weekFocus=week.map(d=>{const p=S.plans[d]||[];return p.length?pct(p.filter(b=>b.done).length,p.length):0});
  const weekFit=week.map(d=>S.fitness.sessions.some(s=>s.date===d&&s.done)?1:0);
  const sleepAvg=avg(S.sleep.slice(-7).map(s=>s.dur));
  const spent=sum(S.money.txns.filter(t=>t.type==='out'&&t.date.slice(0,7)===date.slice(0,7)).map(t=>t.amount));
  const earned=sum(S.money.txns.filter(t=>t.type==='in'&&t.date.slice(0,7)===date.slice(0,7)).map(t=>t.amount)) + (S.money.income||0);
  return {date,plan,doneB,studyPlan,studyDone,fitToday,habitsToday,dayProgress,
    week,weekStudy,weekFocus,weekFit,sleepAvg,spent,earned,
    focusLevel:Math.round(avg(weekFocus.slice(-3))||0),
    scheduleHealth: plan.length? clamp(100 - plan.filter(b=>b.missed&&!b.done).length*18,20,100):60};
}

function extractMinutes(t){
  const h=t.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|h)\b/);

    const p=S.plans[dstr()];

    return `Plan rebuilt for today.\n\n${lines}\n\n${p.length} blocks total. Drag nothing — tell me what changed and I'll recalculate.`;
  },
  weekend(){
    const sat=addDays(dstr(), (6-new Date(dstr()+'T12:00:00').getDay()+7)%7 || 7);
    const sun=addDays(sat,1);
    const p1=buildPlan(sat),p2=buildPlan(sun);
    S.plans[sat]=p1; S.plans[sun]=p2; save();
    const f=(d,p)=>`${dayName(d)} ${d}\n`+p.slice(0,5).map(b=>`  ${hm(b.start)} ${b.title}`).join('\n');
    return `Weekend plan drafted (lighter load, protected recovery):\n\n${f(sat,p1)}\n\n${f(sun,p2)}\n\nBoth days keep a 2-hour buffer. Tell me if you want something specific blocked out.`;
  },
  limited(){
    const m=extractMinutes(arguments[0]||'')||120;
    S.context.hoursAvailable=m;
    S.plans[dstr()]=buildPlan(dstr(),{from:Math.max(nowM(),mins(S.profile.wake))});
    save();
    const p=S.plans[dstr()];
    const lines=p.map(b=>`• ${hm(b.start)} ${b.title} — ${durFmt(b.dur)}`).join('\n');
    return `Understood. ${durFmt(m)} available. Everything else is deferred, not deleted.\n\n${lines}\n\n`+
      `I prioritised by deadline pressure and weakness. If you finish early, say "what's next" and I'll pull something forward.`;
  },
  tired(){
    const plan=S.plans[dstr()]||ensurePlan(dstr());
    const heavy=plan.filter(b=>!b.done&&(b.pri==='P0'||b.pri==='P1'));
    const light=plan.filter(b=>!b.done&&(b.pri==='P2'||b.pri==='P3'));
    /* push the heaviest remaining block later */
    if(heavy[0]&&light[0]){
      heavy[0].start = Math.max(heavy[0].start, 18*60);
      heavy[0].reason = 'Moved later — low energy detected';
      light.forEach(b=>b.pri='P3');
      save();
    }
    return `Noted. Low energy is data, not failure.\n\n`+
      `I've moved your hardest remaining block to your later high-focus window and downgraded ${light.length} low-priority items.\n\n`+
      `Right now, do the smallest useful thing: 15 minutes of active recall on ${weakTopics()[0]?weakTopics()[0].topic:'your weakest topic'}. Then reassess.`;
  },
  missed(){
    const r=replan('Missed block');
    return `Acknowledged — not a failure, a schedule deviation.\n\n`+
      `I've recalculated the rest of today and carried ${r.deferred.length} item${r.deferred.length===1?'':'s'} into tomorrow's plan:\n`+
      (r.deferred.map(d=>`• ${d.title} (${d.pri})`).join('\n')||'• nothing dropped — everything still fits')+
      `\n\nYour Chemistry revision still lands before the test. Nothing critical was lost.`;
  },
  movework(){
    const plan=S.plans[dstr()]||ensurePlan(dstr());
    const w=plan.find(b=>b.cat==='Fitness'&&!b.done);
    if(!w) return `No workout is currently scheduled today. Want me to add one? Say "add workout tomorrow".`;
    w.start=19*60; w.reason='Moved to evening at your request'; save();
    return `Workout moved to 19:00. I re-sequenced the evening so nothing overlaps and your study block still ends before 21:00.`;
  },
  exam(){
    const t=arguments[0]||'';
    const dm=t.match(/(monday|tuesday|wednesday|thursday|friday|saturday|sunday)/i);
    const subj=S.study.subjects.find(s=>t.toLowerCase().includes(s.name.toLowerCase()));
    const day=dm?dm[1]:null;
    let date=addDays(dstr(),2);
    if(day){ const map={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};
      for(let i=1;i<=7;i++){ if(new Date(addDays(dstr(),i)+'T12:00:00').getDay()===map[day.toLowerCase()]){date=addDays(dstr(),i);break} } }
    S.study.exams.push({id:uid(),subject:subj?subj.name:'General',title:`${subj?subj.name:'Exam'} test`,date});
    S.plans[dstr()]=buildPlan(dstr()); S.plans[date]=buildPlan(date); save();
    const weak=weakTopics().filter(w=>!subj||w.sub===subj.name).slice(0,3);
    return `Logged: ${subj?subj.name+' test':'test'} on ${date} (${daysUntil(date)} days).\n\n`+
      `I've reprioritised your plan around it. Focus areas:\n`+
      weak.map(w=>`• ${w.topic} — accuracy ${w.acc}%`).join('\n')+
      `\n\nI'll front-load these in your evening high-focus window, not the morning.`;
  },
  add(){
    const t=arguments[0]||'';
    const title=t.replace(/^(add|remind me to|schedule a|put)\s*/i,'').replace(/\s*(tomorrow|today|tonight).*$/i,'').trim()||'New task';
    const tomorrow=/tomorrow/i.test(t);
    const date=tomorrow?addDays(dstr(),1):dstr();
    if(!S.plans[date]) S.plans[date]=buildPlan(date);
    const start=tomorrow?mins(S.profile.wake)+60:Math.max(nowM()+30,16*60);
    S.plans[date].push({id:uid(),date,start,dur:45,title:title.charAt(0).toUpperCase()+title.slice(1),
      sub:'Added via assistant',cat:'Custom',pri:'P1',reason:'Manually added',done:false});
    S.plans[date].sort((a,b)=>a.start-b.start); save();
    return `Added "${title}" to ${tomorrow?'tomorrow':"today"} at ${hm(start)} (45 min). I shifted lower-priority blocks around it rather than stacking.`;
  },
  week(){
    const m=metrics();
    return `WEEKLY ASSESSMENT\n\n`+
      `Study: ${m.weekStudy.reduce((a,b)=>a+b,0).toFixed(1)}h across 7 days (avg ${avg(m.weekStudy).toFixed(1)}h/day)\n`+
      `Plan completion: ${Math.round(avg(m.weekFocus))}%\n`+
      `Exercise: ${m.weekFit.reduce((a,b)=>a+b,0)}/7 days\n`+
      `Sleep: ${Math.floor(m.sleepAvg/60)}h ${Math.round(m.sleepAvg%60)}m average\n`+
      `Spending this month: ₹${m.spent} of ₹${S.money.budget} budget\n\n`+
      detectPatterns().slice(0,2).map(p=>`${p.type}: ${p.text}`).join('\n\n');
  },
  waste(){
    const st=S.settings.screenTime||{productive:0,entertainment:0};
    const tot=st.productive+st.entertainment;
    return `TIME AUDIT (self-reported + logged)\n\n`+
      `Entertainment screen time: ${durFmt(st.entertainment)}\n`+
      `Productive screen time: ${durFmt(st.productive)}\n`+
      `Planned blocks completed today: ${metrics().dayProgress}%\n\n`+
      `Note: I can only see screen time you log — I don't have device-level access unless you connect it.\n\n`+
      `Practical move: your largest discretionary block is usually late evening. Try shifting entertainment to after your first study block for 7 days and I'll measure the difference.`;
  },
  weak(){
    const w=weakTopics().slice(0,4);
    return `WEAKEST AREAS (ranked by accuracy + recency)\n\n`+
      w.map((x,i)=>`${i+1}. ${x.sub} — ${x.topic}  ·  ${x.acc}% accuracy  ·  ${x.status}`).join('\n')+
      `\n\nRecommendation: don't re-read the chapter. Do 25 targeted questions on ${w[0].topic}. Accuracy at ${w[0].acc}% means the concept is partially there — it's a practice gap, not a knowledge gap.`;
  },
  quick(){
    const m=extractMinutes(arguments[0]||'')||30;
    const w=weakTopics()[0];
    return `You have ${durFmt(m)}. Best use:\n\n`+
      `→ ${m>=25?'25 minutes of':'A quick round of'} ${w.sub} — ${w.topic}\n`+
      `Target: ${Math.round(m/1.5)} practice questions.\n\n`+
      `Why this and not something else: it's your weakest area with the nearest deadline. It also fits cleanly in ${durFmt(m)} with no setup cost.`;
  },
  backlog(){
    const pend=weakTopics().filter(w=>w.status==='Pending');
    const days=Math.max(1,Math.ceil(pend.length/2));
    return `BACKLOG ASSESSMENT\n\n`+
      `Pending topics: ${pend.length}\n`+
      `Distributing all of them immediately would overload your schedule.\n\n`+
      `Recovery plan: ${pend.length} topics across the next ${days} days (2 per day), placed in your evening window while protecting current syllabus coverage.\n\n`+
      `I've already slotted the first two into today. Nothing else changes.`;
  },
  money(){
    const mo=dstr().slice(0,7);
    const out=S.money.txns.filter(t=>t.type==='out'&&t.date.slice(0,7)===mo);
    const inc=S.money.txns.filter(t=>t.type==='in'&&t.date.slice(0,7)===mo);
    const spent=sum(out.map(t=>t.amount)), earned=sum(inc.map(t=>t.amount))+(S.money.income||0);
    const byCat={}; out.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
    const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,3);
    return `MONEY — ${mo}\n\nIncome: ₹${earned}\nSpent: ₹${spent}\nRemaining: ₹${Math.max(earned-spent,0)}\nBudget: ₹${S.money.budget} (${pct(spent,S.money.budget)}% used)\n\n`+
      `Top categories:\n`+top.map(([c,v])=>`• ${c}: ₹${v}`).join('\n')+
      `\n\n${spent>S.money.budget*0.8?'You are at '+pct(spent,S.money.budget)+'% of budget with time remaining. Consider pausing non-essential categories.':'You are within budget. Keep the current pace.'}`;
  },
  status(){
    const m=metrics();
    const g=S.goals.map(x=>x.progress);
    return `CURRENT ASSESSMENT\n\n`+
      `Academic progress: ${Math.round(avg(g.slice(0,2))||0)}%\n`+
      `Fitness consistency: ${pct(m.weekFit.reduce((a,b)=>a+b,0),7)}%\n`+
      `Sleep consistency: ${Math.round(clamp(m.sleepAvg/450*100,0,100))}%\n`+
      `Plan completion today: ${m.dayProgress}%\n\n`+
      `Primary concern: ${weakTopics()[0]?weakTopics()[0].sub+' — '+weakTopics()[0].topic+' backlog':'schedule consistency'}\n`+
      `Nearest deadline: ${S.study.exams.filter(e=>e.date>=dstr()).sort((a,b)=>a.date.localeCompare(b.date))[0]?.title||'none logged'}\n\n`+
      `Recommended action: ${nextBestAction().text}`;
  },
  sleep(){
    const a=avg(S.sleep.slice(-7).map(s=>s.dur));
    return `SLEEP ANALYSIS (last 7 nights)\n\nAverage: ${Math.floor(a/60)}h ${Math.round(a%60)}m\nNights under 7h: ${S.sleep.filter(s=>s.dur<420).length}\n\n`+
      `Observed: your plan completion is ${S.sleep.filter(s=>s.dur<420).length>1?'lower':'stable'} on days following short sleep.\n`+
      `Inference: you may need to protect the sleep window before adding more study hours. Adding hours to a tired day usually costs you the next day.`;
  },
  goal(){
    return `GOAL STATUS\n\n`+S.goals.map(g=>{
      const d=daysUntil(g.deadline);
      const pace = d>0 ? Math.round(g.progress/((g.progress)/ (d) || 1)) : 0;
      return `• ${g.title}\n   ${g.progress}% · ${d} days left · importance ${g.importance}/5 · ${g.cat}`;
    }).join('\n');
  },
  help(){
    return `I understand natural language. Try:\n\n`+
      `• "Plan my day"\n• "What should I do right now?"\n• "I have only 2 hours"\n`+
      `• "I'm tired"\n• "I missed my morning study"\n• "Move my workout to evening"\n`+
      `• "I have a Physics test on Friday"\n• "Where am I wasting time?"\n`+
      `• "Show me my weakest subject"\n• "Give me something productive for 30 minutes"\n`+
      `• "Help me recover my backlog"\n• "I'm completely behind" (Chaos Mode)\n\n`+
      `You can also just describe your situation in your own words.`;
  }
};

function aiRespond(text){
  const intent=matchIntent(text)||'help';
  const fn=H[intent]||H.help;
  try{ return fn(text) }catch(e){ return `I hit an error processing that. ${e.message}` }
}

/* ==========================================================================
   4. SMALL UI COMPONENTS
   ========================================================================== */
function ring(pctVal,size=64,stroke=6,color='var(--cy)',label=''){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-clamp(pctVal,0,100)/100);
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--panel3)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
        style="transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 0 6px ${color})"/>
    </svg>
    <div class="v"><b>${Math.round(pctVal)}%</b>${label?`<small>${label}</small>`:''}</div>
  </div>`;
}
function bar(p,cls=''){ return `<div class="bar ${cls}"><i style="width:${clamp(p,0,100)}%"></i></div>` }
function spark(vals,color='var(--cy)'){
  if(!vals.length) return '';
  const w=260,h=52,max=Math.max(...vals,1)*1.15;
  const pts=vals.map((v,i)=>[i*(w/(Math.max(vals.length-1,1))), h-(v/max)*(h-8)-4]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L ${w} ${h} L 0 ${h} Z`;
  const gid='g'+uid();
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".28"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
function bars(vals,labels,color='var(--cy)'){
  const max=Math.max(...vals,1);
  return `<div style="display:flex;gap:6px;align-items:flex-end;height:78px">`+
    vals.map((v,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end">
      <div style="width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,${color},transparent);
        height:${Math.max((v/max)*100,3)}%;opacity:${v?1:.25};transition:height .5s"></div>
      <span style="font-size:9.5px;color:var(--dim)">${labels[i]||''}</span>
    </div>`).join('')+`</div>`;
}

/* ---------- Block renderer ---------- */
function blockHTML(b,idx){
  const now=nowM(), today=b.date===dstr();
  const live = today && !b.done && now>=b.start && now<b.start+b.dur;
  const missed = today && !b.done && now>=b.start+b.dur;
  const cls=['tl-b',live?'now':'',b.done?'done':'',(missed||b.missed)&&!b.done?'miss':''].join(' ');
  const pc={P0:'rd',P1:'am',P2:'',P3:''}[b.pri]||'';
  const color={Study:'var(--cy)',Fitness:'var(--gr)',Habit:'var(--vi)',Interest:'var(--am)',Routine:'var(--bl)',Goal:'#f472b6',Custom:'var(--mut)'}[b.cat]||'var(--cy)';
  return `<div class="${cls}" data-block="${b.id}">
    <span class="t">${hm(b.start)}<small>${durFmt(b.dur)}</small></span>
    <span class="dot" style="color:${color};background:${color}"></span>
    <div style="flex:1;min-width:0">
      <div class="ttl">${esc(b.title)}</div>
      <div class="sub">${esc(b.sub||'')} ${b.reason?`· <span style="color:var(--dim)">${esc(b.reason)}</span>`:''}</div>
    </div>
    <div class="row" style="gap:5px;flex:none">
      <span class="chip ${pc}" style="font-size:10px">${b.pri}</span>
      <div class="acts">
        ${!b.done?`<button class="btn sm gh" data-act="focus" data-id="${b.id}" title="Focus">▶</button>`:''}
        <button class="btn sm gh" data-act="shift" data-id="${b.id}" data-d="-15" title="Earlier">▲</button>
        <button class="btn sm gh" data-act="shift" data-id="${b.id}" data-d="15" title="Later">▼</button>
        <button class="btn sm gh" data-act="toggleblock" data-id="${b.id}" title="Complete">${b.done?'↺':'✓'}</button>
        <button class="btn sm gh dgr" data-act="delblock" data-id="${b.id}" title="Delete">✕</button>
      </div>
    </div>
  </div>`;
}

  </div>
  <div class="grid g2">
    ${S.habits.map(h=>{
      const log=h.log||{};
      const last7=[...Array(7)].map((_,i)=>addDays(t,-(6-i)));
      const rate=pct(last7.filter(d=>log[d]).length,7);

          </div>
          <div class="row" style="gap:5px">

}

/* ---------- ANALYTICS ---------- */
function viewAnalytics(){
  const m=metrics();
  const last14=[...Array(14)].map((_,i)=>addDays(dstr(),-(13-i)));
  const studyH=last14.map(d=>sum((S.plans[d]||[]).filter(b=>b.cat==='Study'&&b.done).map(b=>b.dur))/60);
  const focusP=last14.map(d=>{const p=S.plans[d]||[];return p.length?pct(p.filter(b=>b.done).length,p.length):0});
  const sleepH=last14.map(d=>{const s=S.sleep.find(x=>x.date===d);return s?s.dur/60:0});
  const patterns=detectPatterns();
  const all=Object.values(S.plans).flat();
  const catMin={};
  all.filter(b=>b.done).forEach(b=>catMin[b.cat]=(catMin[b.cat]||0)+b.dur);
  const totalDone=sum(Object.values(catMin))||1;

  return `
  <div class="topbar"><div><h1>Analytics</h1><p>Patterns across time, study, fitness, sleep and money</p></div></div>

  <div class="grid g4" style="margin-bottom:14px">
    <div class="stat"><div class="k">Study (14d)</div><div class="v">${sum(studyH).toFixed(1)}h</div><div class="s">avg ${avg(studyH).toFixed(1)}h/day</div></div>

    <div class="stat"><div class="k">Sleep avg</div><div class="v">${avg(sleepH.filter(Boolean)).toFixed(1)}h</div><div class="s">${sleepH.filter(x=>x>0&&x<7).length} nights under 7h</div></div>
    <div class="stat"><div class="k">Entertainment</div><div class="v">${durFmt(S.settings.screenTime?.entertainment||0)}</div><div class="s">self-reported today</div></div>
  </div>

  <div class="grid g2">
    <div class="card"><h3>STUDY HOURS (14 DAYS)</h3>${spark(studyH,'var(--cy)')}
      <div class="row" style="margin-top:10px;gap:18px"><div><div class="mini">Best day</div><div style="font-weight:700">${Math.max(...studyH).toFixed(1)}h</div></div>
      <div><div class="mini">Worst day</div><div style="font-weight:700">${Math.min(...studyH).toFixed(1)}h</div></div></div></div>
    <div class="card"><h3>PLAN COMPLETION %</h3>${spark(focusP,'var(--vi)')}
      <div class="row" style="margin-top:10px;gap:18px"><div><div class="mini">Trend</div><div style="font-weight:700">${avg(focusP.slice(7))>avg(focusP.slice(0,7))?'▲ improving':'▼ declining'}</div></div>
      <div><div class="mini">This week</div><div style="font-weight:700">${Math.round(avg(focusP.slice(7)))}%</div></div></div></div>
    <div class="card"><h3>SLEEP DURATION</h3>${spark(sleepH.filter(Boolean),'var(--bl)')}
      <div class="mini" style="margin-top:8px">Target: 7.5–9h. Below 7h correlates with lower completion the following day.</div></div>
    <div class="card"><h3>TIME ALLOCATION (COMPLETED BLOCKS)</h3>
      ${Object.entries(catMin).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div style="margin-bottom:9px">
        <div class="spread" style="margin-bottom:4px"><span style="font-size:12.5px">${c}</span><span class="mono mini">${durFmt(v)} · ${pct(v,totalDone)}%</span></div>
        ${bar(pct(v,totalDone))}
      </div>`).join('')||'<div class="empty">Complete some blocks to see allocation.</div>'}
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <h3>PATTERN DETECTION ${S.settings.mode==='batman'?'· BATMAN MODE':''}</h3>

}

/* ---------- FOCUS OVERLAY ---------- */
let FOCUS=null;
function focusHTML(){
  if(!FOCUS) return '';
  const b=FOCUS.block;
  const elapsed=Math.floor((Date.now()-FOCUS.start)/1000);
  const total=FOCUS.total;
  const left=Math.max(total-elapsed,0);
  const p=pct(total-left,total);
  const mm=pad(Math.floor(left/60)), ss=pad(left%60);
  return `<div class="focus">
    <div class="inner">
      <div class="mini" style="letter-spacing:.24em;margin-bottom:10px">FOCUS SESSION</div>
      <div style="font-size:13px;color:var(--cy);margin-bottom:5px">${esc(b.cat)}${b.subject?' · '+esc(b.subject):''}</div>
      <div style="font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px">${esc(b.title)}</div>
      <div class="mini" style="margin-bottom:22px">${esc(b.sub||'')}</div>
      <div style="display:grid;place-items:center;margin-bottom:22px">${ring(p,168,10,'var(--cy)')}
        <div style="margin-top:-110px;text-align:center">
          <div class="mono" style="font-size:40px;font-weight:800;letter-spacing:.02em">${mm}:${ss}</div>
          <div class="mini">remaining</div>
        </div>
      </div>
      <div style="height:60px"></div>
      <div class="row" style="justify-content:center">
        <button class="btn" data-act="focuspause">${FOCUS.paused?'Resume':'Pause'}</button>
        <button class="btn pri" data-act="focusdone">Complete</button>
        <button class="btn" data-act="focushelp">Need help</button>
        <button class="btn gh" data-act="focusclose">Exit</button>
      </div>
      ${FOCUS.help?`<div class="card" style="margin-top:22px;text-align:left">
        <h3>BLOCKER</h3>
        <div class="mini">Tell me what's blocking you and I'll give you the smallest possible next step.</div>
        <div class="row" style="margin-top:10px">
          <input class="inp" id="helpIn" placeholder="e.g. I don't understand the concept"/>
          <button class="btn" data-act="helpreply">Send</button>
        </div>
        ${FOCUS.helpMsg?`<div class="msg a" style="max-width:100%;margin-top:12px">${esc(FOCUS.helpMsg)}</div>`:''}
      </div>`:''}
    </div>
  </div>`;
}

function currentTitle(){
  if(VIEW==='home') return greeting()+', '+esc(S.profile.name||'there');

}
function subtitle(){
  const d=new Date();
  if(VIEW==='home') return `${dayName(dstr())}, ${dstr()} · ${modeLabel()}`;
  const map={
    today:'Your executed timeline for today',
    assistant:'Natural language interface',
    study:'Subject, topic and weakness tracking',
    fitness:'Consistency, recovery and progression',
    goals:'Long-term objectives broken into steps',
    habits:'Trends, not streaks',
    money:'Budget, spending and savings',
    interests:'Hobbies and skill development',
    calendar:'Commitments and upcoming deadlines',
    analytics:'Evidence and pattern detection',
    memory:'What the assistant knows about you',
    settings:'Identity, profile and controls'
  };
  return map[VIEW]||'';
}

function render(){
  document.documentElement.dataset.theme=S.settings.theme||'dark';
  const app=$('#app');

  if(!S.onboarded){ app.innerHTML=viewOnboarding(); renderFocus(); return }

  let body='';
  switch(VIEW){
    case 'home': body=viewHome(); break;
    case 'assistant': body=viewAssistant(); break;
    case 'today': body=viewToday(); break;
    case 'study': body=viewStudy(); break;
    case 'fitness': body=viewFitness(); break;
    case 'goals': body=viewGoals(); break;
    case 'habits': body=viewHabits(); break;
    case 'money': body=viewMoney(); break;
    case 'interests': body=viewInterests(); break;
    case 'calendar': body=viewCalendar(); break;
    case 'analytics': body=viewAnalytics(); break;
    case 'memory': body=viewMemory(); break;
    case 'settings': body=viewSettings(); break;
    default: body=viewHome();
  }

  const now=new Date();
  app.innerHTML=`
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <div class="orb"></div>
        <div><b>${esc(S.profile.aiName||'ARES')}</b><span>Life OS</span></div>
      </div>
      <nav class="nav">
        ${NAV.map(n=>`<button class="nav-i ${VIEW===n.id?'on':''}" data-act="nav" data-id="${n.id}">
          <i>${n.icon}</i><span>${n.label}</span></button>`).join('')}
      </nav>
      <div class="side-foot">LEVEL ${Math.floor(S.xp/500)+1} · ${S.xp} XP<br>LOCAL · ENCRYPTED AT REST</div>
    </aside>
    <main>
      <div class="topbar">
        <div><h1>${currentTitle()}</h1><p>${subtitle()}</p></div>
        <div class="clock">
          <b class="mono" id="clock">${pad(now.getHours())}:${pad(now.getMinutes())}</b>
          <span>${modeLabel()}</span>
        </div>
      </div>
      ${body}
    </main>
  </div>
  ${focusHTML()}`;

  if(VIEW==='assistant'){ const c=$('#chat'); if(c) c.scrollTop=c.scrollHeight; }
  renderFocus();
  save();
}
function renderFocus(){
  const app=$('#app');
  const existing=$('.focus');
  if(FOCUS&&!existing) app.insertAdjacentHTML('beforeend',focusHTML());
  else if(existing&&FOCUS){
    const tmp=document.createElement('div'); tmp.innerHTML=focusHTML();
    existing.replaceWith(tmp.firstElementChild);
  } else if(existing&&!FOCUS) existing.remove();
}

        <div class="field" style="flex:2"><label class="f">School / college / work</label><input class="inp" id="ob_role" value="${esc(d.role||'')}" placeholder="e.g. Grade 12 student"/></div>
      </div>
      <div class="row" style="gap:10px">
        <div class="field" style="flex:1"><label class="f">Wake time</label><input class="inp" id="ob_wake" value="${esc(d.wake||'07:00')}"/></div>
        <div class="field" style="flex:1"><label class="f">Sleep time</label><input class="inp" id="ob_sleep" value="${esc(d.sleep||'23:00')}"/></div>
      </div>
      <div class="field"><label class="f">Fixed commitment on weekdays (optional)</label>
        <div class="row" style="gap:8px">
          <input class="inp" id="ob_cstart" value="${esc(d.cstart||'08:30')}" style="flex:1"/>
          <span class="mini">to</span>
          <input class="inp" id="ob_cend" value="${esc(d.cend||'15:30')}" style="flex:1"/>
        </div>
      </div>`;
  } else if(s===2){
    inner=`
      <h2 style="font-size:21px;margin-bottom:5px">What are you working toward?</h2>
      <p style="color:var(--mut);font-size:13px;margin-bottom:20px">Add as many as you like. You can add more later.</p>
      <div class="field"><label class="f">Goal</label><input class="inp" id="ob_g1" placeholder="e.g. Score 90%+ in final exams" value="${esc(d.g1||'')}"/></div>
      <div class="field"><label class="f">Second goal (optional)</label><input class="inp" id="ob_g2" placeholder="e.g. Exercise 4 times a week" value="${esc(d.g2||'')}"/></div>
      <div class="field"><label class="f">Third goal (optional)</label><input class="inp" id="ob_g3" placeholder="e.g. Learn to code" value="${esc(d.g3||'')}"/></div>`;
  } else {
    inner=`
      <h2 style="font-size:21px;margin-bottom:5px">What should I track closely?</h2>
      <p style="color:var(--mut);font-size:13px;margin-bottom:20px">Pick anything that applies. I'll keep the rest off your screen.</p>
      <div class="row" id="ob_focus" style="gap:8px">
        ${['Study','Fitness','Habits','Money','Hobbies','Sleep','Screen time','Skills'].map(x=>`<button class="btn" data-id="${x}">${x}</button>`).join('')}
      </div>
      <div style="margin-top:26px" class="hr"></div>
      <div class="mini">You stay in control. Every recommendation can be overridden, every plan edited, and all data deleted at any time.</div>`;
  }

  return `<div class="ob"><div class="ob-c">
    <div class="card">
      <div class="steps">${steps.map((_,i)=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>
      ${inner}
      <div class="row" style="margin-top:22px;justify-content:space-between">
        <button class="btn gh" data-act="obskip">Skip — load demo profile</button>
        <div class="row">
          ${s>0?`<button class="btn" data-act="obback">Back</button>`:''}
          <button class="btn pri" data-act="obnext">${s===3?'Finish setup':'Continue'}</button>
        </div>
      </div>
    </div>
  </div></div>`;
}
function obCollect(){
  const g=id=>{const e=$('#'+id);return e?e.value.trim():''};
  const d=OB.data;
  if(OB.step===0){
    d.name=g('ob_name')||'there'; d.aiName=g('ob_ai')||'ARES';
    const p=$('#ob_person .on'); if(p) d.personality=p.dataset.id;
  } else if(OB.step===1){
    d.age=g('ob_age'); d.role=g('ob_role'); d.wake=g('ob_wake')||'07:00'; d.sleep=g('ob_sleep')||'23:00';
    d.cstart=g('ob_cstart'); d.cend=g('ob_cend');
  } else if(OB.step===2){
    d.g1=g('ob_g1'); d.g2=g('ob_g2'); d.g3=g('ob_g3');
  } else {
    d.focus=$$('#ob_focus .btn.on').map(b=>b.dataset.id);
  }
}

/* ==========================================================================
   8. EVENTS
   ========================================================================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t) return;
  const act=t.dataset.act, id=t.dataset.id;

  /* --- onboarding pills --- */
  if(OB&&!S.onboarded){
    if(t.closest('#ob_person')){ $$('#ob_person button').forEach(b=>b.classList.remove('on')); t.classList.add('on'); return }
    if(t.closest('#ob_focus')){ t.classList.toggle('on'); return }
  }

  switch(act){
    /* ---------- navigation ---------- */
    case 'nav': VIEW=id; render(); window.scrollTo(0,0); break;

    /* ---------- onboarding ---------- */
    case 'obnext':{
      obCollect();
      if(OB.step<3){ OB.step++; render(); return }
      /* finish */
      const d=OB.data;
      S=blankState();
      S.onboarded=true;
      S.profile.name=d.name||'there';
      S.profile.aiName=d.aiName||'ARES';
      S.profile.personality=d.personality||'Direct';
      S.profile.age=d.age||''; S.profile.role=d.role||'';
      S.profile.wake=d.wake||'07:00'; S.profile.sleep=d.sleep||'23:00';
      if(d.cstart&&d.cend) S.profile.commitments=[{id:uid(),title:'School / Work',days:[1,2,3,4,5],start:d.cstart,end:d.cend}];
      const mk=(title,i)=>title?{id:uid(),title,cat:'Personal',deadline:addDays(dstr(),90),importance:5-i,progress:0,target:'',why:'',effort:'',parent:null,milestones:[]}:null;
      S.goals=[mk(d.g1,0),mk(d.g2,1),mk(d.g3,2)].filter(Boolean);
      (d.focus||[]).forEach(f=>{
        if(f==='Study') S.study.subjects=[{id:uid(),name:'Subject 1',topics:[]}];
        if(f==='Fitness') S.fitness.goal='General fitness';
        if(f==='Habits') S.habits=[{id:uid(),name:'Wake before 7:00',cadence:'daily',log:{},best:0},{id:uid(),name:'Study 2 hours',cadence:'daily',log:{},best:0}];
        if(f==='Money') S.money.budget=2000;
      });
      S.memory.push({id:uid(),kind:'Preference',text:`Preferred communication style: ${S.profile.personality}.`,date:dstr()});
      S.plans[dstr()]=buildPlan(dstr());
      S.chat=[{role:'a',text:`${S.profile.aiName} online.\n\nI've built your first plan for today and loaded your goals. Ask me "What should I do right now?" whenever you're unsure.\n\nYou can override anything I suggest — I recommend, you decide.`,t:Date.now()}];
      OB={step:0,data:{}};
      VIEW='home'; save(); render();
      toast('Setup complete. Welcome aboard.');
      break;
    }
    case 'obback': obCollect(); OB.step=Math.max(0,OB.step-1); render(); break;
    case 'obskip':{
      S=demoState(); save(); VIEW='home'; render();
      toast('Demo profile loaded. Explore freely.');
      break;
    }

    /* ---------- planner ---------- */
    case 'replan':{
      const r=replan('Manual recalculation');
      toast(`Recalculated · ${r.deferred.length} block(s) carried forward`);
      render(); break;
    }
    case 'chaos':{
      S.context.hoursAvailable=null;
      const p=(S.plans[dstr()]||ensurePlan(dstr())).filter(b=>!b.done);
      p.sort((a,b)=>PRI_W[b.pri]-PRI_W[a.pri]);
      p.forEach((b,i)=>{ if(i>=3){ b.pri='P3'; b.reason='Deprioritised — Chaos Mode' } });
      save(); VIEW='today'; render();
      toast('Chaos Mode: top 3 blocks only');
      break;
    }
    case 'toggleblock':{
      const b=(S.plans[dstr()]||[]).find(x=>x.id===id);
      if(b){ b.done=!b.done; if(b.done){ b.missed=false; S.xp+=15;
        /* habit auto-log */
        const h=S.habits.find(h=>b.title.toLowerCase().includes(h.name.toLowerCase().slice(0,6)));
        if(h){ h.log=h.log||{}; h.log[dstr()]=true }
      } else S.xp=Math.max(0,S.xp-15); save() }
      render(); break;
    }
    case 'shift':{
      const b=(S.plans[dstr()]||[]).find(x=>x.id===id);
      if(b){ b.start=clamp(b.start+parseInt(t.dataset.d),0,1439); S.plans[dstr()].sort((a,b2)=>a.start-b2.start); save() }
      render(); break;
    }
    case 'delblock':{
      const p=S.plans[dstr()]||[]; S.plans[dstr()]=p.filter(x=>x.id!==id); save(); render(); break;
    }
    case 'focus':{
      const b=(S.plans[dstr()]||[]).find(x=>x.id===id);
      if(b){ FOCUS={block:b,total:b.dur*60,start:Date.now(),paused:false,help:false,helpMsg:''}; render() }
      break;
    }
    case 'focusnext':{
      const n=nextBestAction();
      if(n.block){ FOCUS={block:n.block,total:n.block.dur*60,start:Date.now(),paused:false,help:false,helpMsg:''}; render() }
      else toast('Nothing scheduled — take the rest.');
      break;
    }
    case 'focusclose': FOCUS=null; render(); break;
    case 'focuspause': if(FOCUS){ FOCUS.paused=!FOCUS.paused;
      if(FOCUS.paused) FOCUS.pauseAt=Date.now();
      else { FOCUS.start+=Date.now()-(FOCUS.pauseAt||Date.now()) }
      render() } break;
    case 'focusdone':{
      if(FOCUS){ const b=FOCUS.block; b.done=true; b.missed=false; S.xp+=25; FOCUS=null; save(); render(); toast('Session logged. +25 XP') }
      break;
    }
    case 'focushelp': if(FOCUS){ FOCUS.help=true; render() } break;
    case 'helpreply':{
      const inp=$('#helpIn'); const v=inp?inp.value.trim():'';
      if(FOCUS&&v){
        const w=weakTopics()[0];
        FOCUS.helpMsg = /understand|confus|don'?t get|concept/i.test(v)
          ? `That's a knowledge gap, not a discipline problem. Switch to first-pass mode: read the section once slowly, write the concept in your own words in 3 lines, then do 3 easy questions. If you still can't, mark it as a prerequisite gap and move to ${w?w.topic:'another topic'} — I'll reschedule this one.`
          : /distract|phone|focus|attention/i.test(v)
          ? `Put the phone in another room for the remaining time. One block. Then you can have it back. If that's too hard right now, do 10 minutes on / 2 minutes off instead.`
          : /tired|sleep|energy/i.test(v)
          ? `Then this block is mispriced. Reduce it to 10 minutes of the easiest sub-task, then stop. Better to keep the sequence alive than force a bad hour.`
          : `Break it into the smallest possible action. What is the one thing you could finish in 5 minutes? Do only that, then reassess.`;
        save(); render();
      }
      break;
    }

    /* ---------- assistant ---------- */
    case 'send':{
      const inp=$('#chatIn'); const v=inp?inp.value.trim():'';
      if(!v) return;
      userPush(v); inp.value='';
      const reply=aiRespond(v);
      setTimeout(()=>{ aiPush(reply); render();
        const c=$('#chat'); if(c) c.scrollTop=c.scrollHeight;
        const i=$('#chatIn'); if(i) i.focus();
      },260);
      render();
      break;
    }
    case 'quick':{
      userPush(id);
      const reply=aiRespond(id);
      setTimeout(()=>{ aiPush(reply); render(); },260);
      render();
      break;
    }

    /* ---------- study ---------- */
    case 'bump':{
      const sub=S.study.subjects.find(s=>s.id===t.dataset.sub);
      if(sub){ const tp=sub.topics.find(x=>x.id===t.dataset.id);
        if(tp){ tp.revisions++; tp.last=dstr();
          tp.accuracy=clamp(tp.accuracy+(tp.status==='Pending'?48:rnd(2,7)),0,100);
          if(tp.accuracy>75) tp.status='Strong';
          else if(tp.accuracy>0) tp.status='Weak';
          S.xp+=10; save(); render(); toast('Revision logged · +10 XP') } }
      break;
    }
    case 'deltopic':{
      const sub=S.study.subjects.find(s=>s.id===t.dataset.sub);
      if(sub){ sub.topics=sub.topics.filter(x=>x.id!==t.dataset.id); save(); render() }
      break;
    }
    case 'addtopic':{
      const sub=S.study.subjects.find(s=>s.id===t.dataset.sub);
      const n=prompt('Topic name:'); if(!n) break;
      sub.topics.push({id:uid(),name:n,status:'Pending',accuracy:0,revisions:0,last:null});
      save(); render(); break;
    }
    case 'addsubject':{
      const n=prompt('Subject name:'); if(!n) break;
      S.study.subjects.push({id:uid(),name:n,topics:[]}); save(); render(); break;
    }
    case 'addexam':{
      const s=prompt('Subject:'); if(!s) break;
      const d=prompt('Date (YYYY-MM-DD):',addDays(dstr(),7)); if(!d) break;
      S.study.exams.push({id:uid(),subject:s,title:s+' test',date:d});
      S.plans[dstr()]=buildPlan(dstr()); save(); render(); toast('Exam logged — plan reprioritised'); break;
    }
    case 'studysession':{
      const sub=S.study.subjects.find(s=>s.id===t.dataset.sub);
      const m=parseInt(prompt('Minutes studied:','45')||'0');
      if(m>0){ S.study.sessions.push({id:uid(),subject:sub.name,date:dstr(),mins:m});
        S.xp+=m; save(); render(); toast(`${m} minutes logged`); }
      break;
    }

    /* ---------- fitness ---------- */
    case 'logworkout':{
      const ty=prompt('Type (Strength / Cardio / Mobility):','Strength')||'Strength';
      const du=parseInt(prompt('Duration in minutes:','45')||'0');
      if(du>0){
        S.fitness.sessions.push({id:uid(),date:dstr(),type:ty,dur:du,done:true,steps:Math.round(rnd(3000,9000))});
        S.xp+=30; save(); render(); toast('Workout logged · +30 XP');
      }
      break;
    }
    case 'delworkout': S.fitness.sessions=S.fitness.sessions.filter(x=>x.id!==id); save(); render(); break;

    /* ---------- goals ---------- */
    case 'addgoal':{
      const title=prompt('Goal name:'); if(!title) break;
      const cat=prompt('Category (Education/Career/Health/Finance/Skills/Hobby/Social/Personal):','Education')||'Education';
      const dl=prompt('Deadline (YYYY-MM-DD):',addDays(dstr(),90))||addDays(dstr(),90);
      S.goals.push({id:uid(),title,cat,deadline:dl,importance:4,progress:0,target:'',why:'',effort:'',parent:null,milestones:[]});
      S.xp+=20; save(); render(); toast('Goal added'); break;
    }
    case 'goalprogress':{
      const g=S.goals.find(x=>x.id===id);
      if(g){ g.progress=clamp(g.progress+parseInt(t.dataset.d),0,100); save(); render() }
      break;
    }
    case 'delgoal': S.goals=S.goals.filter(x=>x.id!==id); save(); render(); break;

    /* ---------- habits ---------- */
    case 'addhabit':{
      const n=prompt('Habit name:'); if(!n) break;
      S.habits.push({id:uid(),name:n,cadence:'daily',log:{},best:0}); save(); render(); break;
    }
    case 'togglehabit':{
      const h=S.habits.find(x=>x.id===id);
      if(h){ h.log=h.log||{}; h.log[dstr()]=!h.log[dstr()];
        if(h.log[dstr()]) S.xp+=10;
        let s=0; for(let i=0;i<90;i++){ if(h.log[addDays(dstr(),-i)]) s++; else break }
        h.best=Math.max(h.best||0,s); save(); render() }
      break;
    }
    case 'delhabit': S.habits=S.habits.filter(x=>x.id!==id); save(); render(); break;

    /* ---------- money ---------- */
    case 'addtxn':{
      const amt=parseFloat(prompt('Amount:')); if(!amt) break;
      const ty=(prompt('Type: in / out','out')||'out').toLowerCase().includes('in')?'in':'out';
      const cat=prompt('Category (Food/Education/Entertainment/Transport/Shopping/Hobbies/Other):','Food')||'Other';
      const note=prompt('Note (optional):','')||'';
      S.money.txns.push({id:uid(),date:dstr(),amount:amt,cat,type:ty,note});
      save(); render(); toast('Transaction logged'); break;
    }
    case 'deltxn': S.money.txns=S.money.txns.filter(x=>x.id!==id); save(); render(); break;

    /* ---------- interests / skills ---------- */
    case 'addinterest':{
      const n=prompt('Interest name:'); if(!n) break;
      S.interests.push({id:uid(),name:n,unit:'points',value:0,target:10,weekMin:120,log:{}});
      save(); render(); break;
    }
    case 'loginterest':{
      const it=S.interests.find(x=>x.id===id);
      if(it){ it.log=it.log||{}; it.log[dstr()]=(it.log[dstr()]||0)+30; it.value+=1; S.xp+=10; save(); render(); toast('Logged 30 min') }
      break;
    }
    case 'delinterest': S.interests=S.interests.filter(x=>x.id!==id); save(); render(); break;
    case 'addskill':{
      const n=prompt('Skill name:'); if(!n) break;
      S.skills.push({id:uid(),name:n,level:1,target:4,resources:'',milestones:['Fundamentals','Intermediate','Projects','Advanced'],progress:10});
      save(); render(); break;
    }
    case 'skillup':{
      const s=S.skills.find(x=>x.id===id);
      if(s){ s.level=clamp(s.level+1,1,s.target); s.progress=pct(s.level,s.target); S.xp+=40; save(); render(); toast('Level up · +40 XP') }
      break;
    }
    case 'delskill': S.skills=S.skills.filter(x=>x.id!==id); save(); render(); break;

    /* ---------- calendar ---------- */
    case 'addevent':{
      const n=prompt('Event title:'); if(!n) break;
      const d=prompt('Date (YYYY-MM-DD):',dstr())||dstr();
      const st=prompt('Start time (HH:MM):','18:00')||'18:00';
      const en=prompt('End time (HH:MM):','19:00')||'19:00';
      S.events.push({id:uid(),title:n,date:d,start:st,end:en});
      S.plans[d]=buildPlan(d); save(); render(); toast('Event added'); break;
    }
    case 'fakeconnect': toast('Integration not available in this build.'); break;

    /* ---------- memory ---------- */
    case 'addmemory':{
      const k=prompt('Type (Preference/Constraint/Study method/Goal/Plan):','Preference')||'Preference';
      const v=prompt('What should I remember?'); if(!v) break;
      S.memory.push({id:uid(),kind:k,text:v,date:dstr()}); save(); render(); break;
    }
    case 'delmemory': S.memory=S.memory.filter(x=>x.id!==id); save(); render(); break;
    case 'clearmemory': if(confirm('Delete all stored memories?')){ S.memory=[]; save(); render() } break;

    case 'export':{
      const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='ares-export-'+dstr()+'.json'; a.click();
      toast('Exported.'); break;
    }
    case 'resetall':{
      if(confirm('Delete ALL data permanently? This cannot be undone.')){
        localStorage.removeItem(KEY); S=blankState(); OB={step:0,data:{}}; VIEW='home'; render();
      }
      break;
    }

    /* ---------- settings ---------- */
    case 'settheme': S.settings.theme=id; save(); render(); break;
    case 'setmode': S.settings.mode=id; save(); render();
      toast(id==='jarvis'?'JARVIS mode active':id==='batman'?'Batman mode active — pattern analysis on':'Standard mode'); break;
    case 'setpersonality': S.profile.personality=id; save(); render(); break;
    case 'togglenotif': S.settings.notif=!S.settings.notif; save(); render(); break;
    case 'setfitnessgoal': break;
  }
});

/* change / input handlers */
document.addEventListener('change',e=>{

  if(!t) return;

    } else S.settings[k]=Number(t.value)||0;
    save(); render();
  }
  if(act==='setenergy'){ S.profile.energy=Number(t.value); save(); render() }

/* keyboard */

/* live clock + focus ticker */
setInterval(()=>{
  const c=$('#clock');
  if(c){ const d=new Date(); c.textContent=pad(d.getHours())+':'+pad(d.getMinutes()) }
  if(FOCUS&&!FOCUS.paused){
    const left=FOCUS.total-Math.floor((Date.now()-FOCUS.start)/1000);
    const el=$('.focus .mono');
    if(el) el.textContent=pad(Math.floor(Math.max(left,0)/60))+':'+pad(Math.max(left,0)%60);
    const circle=$('.focus circle:last-of-type');
    if(circle){ const p=pct(FOCUS.total-Math.max(left,0),FOCUS.total);
      const r=79, c2=2*Math.PI*r; circle.setAttribute('stroke-dashoffset',c2*(1-p/100)) }
    if(left<=0){ toast('Focus session complete'); FOCUS=null; render() }
  }
},1000);

/* hourly re-check of plan freshness */
setInterval(()=>{ if(S&&S.onboarded){ const t=dstr(); if(!S.plans[t]) S.plans[t]=buildPlan(t); save() } }, 60000);

/* ==========================================================================
   9. BOOT
   ========================================================================== */
(function boot(){
  const saved=load();
  if(saved){ S=saved; S.context=S.context||{hoursAvailable:null,note:''};
    S.settings.screenTime=S.settings.screenTime||{productive:0,entertainment:0};
    S.profile.commitments=S.profile.commitments||[]; S.events=S.events||[];
    S.memory=S.memory||[]; S.chat=S.chat||[];
    if(!S.plans[dstr()]) S.plans[dstr()]=buildPlan(dstr());
    save();
  } else {
    S=blankState();
    OB={step:0,data:{}};
  }
  render();
  if(S.onboarded){
    /* proactive morning briefing once per day */
    const key='ares.brief.'+dstr();
    if(!localStorage.getItem(key)){
      const nba=nextBestAction();
      const m=metrics();
      setTimeout(()=>{
        const b=buildBriefing();
        aiPush(b);
        localStorage.setItem(key,'1');
        if(VIEW==='assistant'||VIEW==='home') render();
        toast(S.profile.aiName+' has your briefing ready.');
      },1200);
    }
  }
})();

/* ==========================================================================
   10. BRIEFING + REVIEW GENERATORS
   ========================================================================== */
function buildBriefing(){
  const m=metrics();
  const plan=m.plan.filter(b=>!b.done);
  const ex=S.study.exams.filter(e=>e.date>=dstr()).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const fit=plan.filter(b=>b.cat==='Fitness')[0];
  const top=plan.filter(b=>b.pri==='P0'||b.pri==='P1').slice(0,3);
  return `${greeting().toUpperCase()}.\n\n`+
    `TODAY'S PRIORITIES\n`+
    (top.length?top.map((b,i)=>`${i+1}. ${b.title} — ${durFmt(b.dur)}`).join('\n'):'Nothing critical scheduled.')+
    `\n\nFITNESS\n${fit?`${fit.title} · ${durFmt(fit.dur)}`:'Rest day — recovery is part of the plan'}\n\n`+
    `IMPORTANT\n${ex?`${ex.title} in ${daysUntil(ex.date)} day${daysUntil(ex.date)===1?'':'s'}`:'No deadlines in the next few days'}\n\n`+
    `SCHEDULE HEALTH\n${m.scheduleHealth}% · ${plan.length} blocks remaining\n\n`+
    `RECOMMENDATION\n${nextBestAction().text} — ${nextBestAction().why}`;
}

function buildNightReview(){
  const m=metrics();
  const done=m.plan.filter(b=>b.done), missed=m.plan.filter(b=>!b.done&&b.start+b.dur<nowM());
  const studyP=pct(m.studyDone.length,Math.max(m.studyPlan.length,1));
  const habitP=pct(m.habitsToday,Math.max(S.habits.length,1));
  let streak=0; const h=S.habits[0];
  if(h){ for(let i=0;i<90;i++){ if(h.log&&h.log[addDays(dstr(),-i)]) streak++; else break } }
  return `DAILY REVIEW — ${dstr()}\n\n`+
    `Study: ${studyP}%\nFitness: ${m.fitToday?'100%':'0'}%\nHabits: ${habitP}%\nPlan completion: ${m.dayProgress}%\n\n`+
    `WHAT WENT WELL\n`+
    (done.length?done.slice(0,3).map(b=>`• ${b.title} (${durFmt(b.dur)})`).join('\n'):'• You showed up and logged the day. That counts.')+
    `\n\nWHAT CAUSED PROBLEMS\n`+
    (missed.length?missed.slice(0,3).map(b=>`• ${b.title} — scheduled ${hm(b.start)}`).join('\n'):'• Nothing significant.')+
    `\n\nTOMORROW'S ADJUSTMENT\n`+
    (missed.length
      ? `I've moved ${missed.length} unfinished block${missed.length===1?'':'s'} into tomorrow morning and reduced tomorrow's lowest-priority items so the day stays realistic.`
      : `Keep the current structure. Consider adding 15 minutes to your weakest subject.`)+
    `\n\nSleep window: ${S.profile.sleep}. Protect it.`;
}
